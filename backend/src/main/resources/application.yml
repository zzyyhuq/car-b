server:
  # 本机 8080 被 Jenkins 占用，后端改用 8081
  port: 8081

spring:
  # 默认加载 application-local.yml（本地私有配置，已被 Git 忽略）
  profiles:
    active: local
  application:
    name: car-beauty-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/car_beauty?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:beauty}
    password: ${DB_PASSWORD:Beauty@2026}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Redis 没启动时快速失败再降级查库，不让请求卡在 10 秒的默认连接超时上
      connect-timeout: 500ms
      timeout: 800ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 走 SLF4J：开发环境（logback-spring.xml 的 !prod）自动打开 DEBUG 打印，
    # 生产环境 INFO 级别自动静默，不用改代码
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 接口文档：http://localhost:8081/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    # 刷新页面后 Authorize 里填的 token 不丢
    persist-authorization: true

jwt:
  # 至少 32 字节，正式上线一定要改
  secret: car-beauty-graduation-project-jwt-secret-key-2026-change-me-in-production
  expire-days: 7

wx:
  # 微信登录：AppID 在 miniprogram/project.config.json，AppSecret 在微信公众平台生成
  # 推荐写到 application-local.yml（已被 git 忽略）或环境变量，不要提交到仓库
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
