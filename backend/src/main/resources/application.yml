server:
  # 本机 8080 被 Jenkins 占用，后端改用 8081
  port: 8081

spring:
  application:
    name: car-beauty-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/car_beauty?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:beauty}
    password: ${DB_PASSWORD:Beauty@2026}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，答辩前可以关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# 接口文档：http://localhost:8081/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    # 刷新页面后 Authorize 里填的 token 不丢
    persist-authorization: true

jwt:
  # 至少 32 字节，正式上线一定要改
  secret: car-beauty-graduation-project-jwt-secret-key-2026-change-me-in-production
  expire-days: 7

wx:
  # 阶段3接微信登录时填，也可以走环境变量
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
